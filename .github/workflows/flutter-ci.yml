name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web preview
        run: flutter build web --release

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: solar-ops-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build synthetic UI fixture
        run: flutter build web --release -t test/preview_app.dart

      - name: Verify mobile web layout
        run: |
          npm install --prefix /tmp/solar-ui playwright@1.63.0 --no-audit --no-fund
          /tmp/solar-ui/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --directory build/web > /tmp/solar-ui-server.log 2>&1 &
          SOLAR_UI_MODULE=/tmp/solar-ui/node_modules/playwright node scripts/verify-web-ui.cjs

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-ops-ui-screenshots
          path: ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
